<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DemetrAg · Farm home</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 32 32" class="brand-mark" aria-hidden="true">
        <rect width="32" height="32" rx="9" fill="#1B8A4C"/>
        <path d="M7 22c4-1 7-4 9-9m-9 13c6-1 11-5 13-12m-13 16c8-1 14-6 17-15" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
      </svg>
      <span class="brand-name">DemetrAg</span>
    </div>
    <div class="farm-wrap">
      <button class="farm-switch" id="farm-switch" data-action="farms" aria-haspopup="true">Loading…</button>
      <span class="tag tag-synthetic" data-tip="Farm records come from the EU Agri Hackathon synthetic dataset. Not a real farm." tabindex="0">Synthetic data</span>
      <div class="menu farm-menu" id="farm-menu" hidden></div>
    </div>
    <div class="top-right">
      <span class="today" id="today"></span>
      <span class="live live-local" id="live" tabindex="0">…</span>
      <span class="log-count" id="log-count"></span>
      <button class="btn ghost" data-action="onboarding"><svg class="ico-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>Onboarding</button>
      <button class="btn primary" data-action="log"><svg class="ico-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>Log activity</button>
      <div class="more-wrap">
        <button class="icon-btn" data-action="more" aria-label="More" aria-haspopup="true"><svg class="ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></button>
        <div class="menu more-menu" id="more-menu" hidden>
          <button class="menu-item" data-action="phone">Phone app link</button>
          <button class="menu-item" data-action="sources">Data sources</button>
          <button class="menu-item danger" data-action="reset">Reset demo</button>
        </div>
      </div>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="Farm overview"></nav>
    <main id="main" class="main"><div class="loading">Loading farm data…</div></main>
  </div>

  <aside id="drawer" class="drawer" aria-label="Field details"></aside>
  <div id="phone-panel" class="phone-panel" hidden></div>
  <div id="sources-panel" class="phone-panel sheet" hidden></div>
  <div id="capture" class="modal" hidden></div>
  <div id="onboarding" class="modal" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
